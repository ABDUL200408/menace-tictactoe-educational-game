# MENACE dual-theme configuration.
# Streamlit 1.51+ supports separate light and dark theme tables.
# The light palette mirrors the established MENACE interface; the dark palette
# changes only surfaces/text while semantic action, X/O and bead colours remain.

[theme]
font = "sans-serif"
headingFont = "sans-serif"
showSidebarBorder = true

[theme.light]
primaryColor = "#267a3f"
backgroundColor = "#fffaf1"
secondaryBackgroundColor = "#fffdf8"
textColor = "#2f241d"
borderColor = "#e4d6c5"
blueColor = "#0f6f9f"
blueBackgroundColor = "#eef6fd"
blueTextColor = "#1769aa"
greenColor = "#267a3f"
greenBackgroundColor = "#eefaf2"
greenTextColor = "#24834b"
redColor = "#d84343"
redBackgroundColor = "#fff3f4"
redTextColor = "#c43832"
orangeColor = "#c87800"
orangeBackgroundColor = "#fff5ce"
orangeTextColor = "#a85f00"
yellowColor = "#bf7b12"
yellowBackgroundColor = "#fff8df"
yellowTextColor = "#775000"
grayColor = "#75675d"
grayBackgroundColor = "#fffaf2"
grayTextColor = "#75675d"

[theme.light.sidebar]
primaryColor = "#0f6f9f"
backgroundColor = "#f4eee5"
secondaryBackgroundColor = "#fffdf8"
textColor = "#2f241d"
borderColor = "#e4d6c5"
blueColor = "#0f6f9f"
blueBackgroundColor = "#e8f3f9"
blueTextColor = "#0b5d86"
greenColor = "#267a3f"
greenBackgroundColor = "#e6f5ea"
greenTextColor = "#185a2c"
redColor = "#d84343"
redBackgroundColor = "#fdeaea"
redTextColor = "#9f2525"
grayColor = "#75675d"
grayBackgroundColor = "#f4eee5"
grayTextColor = "#75675d"

[theme.dark]
primaryColor = "#45b96a"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#171b22"
textColor = "#f3f5f7"
borderColor = "#34404d"
blueColor = "#4da8dc"
blueBackgroundColor = "#172f40"
blueTextColor = "#8dd2f3"
greenColor = "#45b96a"
greenBackgroundColor = "#173522"
greenTextColor = "#7be29a"
redColor = "#ef6a67"
redBackgroundColor = "#3a2020"
redTextColor = "#ffaaa8"
orangeColor = "#e9a83a"
orangeBackgroundColor = "#3b2c14"
orangeTextColor = "#ffd07d"
yellowColor = "#d9ad41"
